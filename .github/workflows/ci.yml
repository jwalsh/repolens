name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Pinned by commit SHA, which is what setup-uv's own README recommends
      # and the only immutable ref. Note there is no moving `v10` tag -- the
      # project stopped publishing those after v7 -- so `@v10` does not
      # resolve at all.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # No `version` here on purpose. With none given, setup-uv reads
          # `required-version` from pyproject.toml, so the uv version lives in
          # exactly one place and uv itself enforces it locally too. Pinning
          # it matters because the requirements check below compares generated
          # output, and uv changes that output between releases -- 0.6 emitted
          # no `# via` annotations, 0.12 does.
          #
          # No `python-version` either. `uv sync` reads .python-version and
          # provisions the interpreter, which is what happens locally.

      # repolens.gitcheck enforces this at import time for the application and
      # the resolver, so the suite would fail anyway. Checking it here first
      # turns a wall of tracebacks into one line, before spending time on sync.
      - name: Require a recent git
        run: |
          set -euo pipefail
          git --version
          uv run --no-project python -c "
          import re, subprocess, sys
          out = subprocess.run(['git','--version'], capture_output=True, text=True).stdout
          m = re.search(r'(\d+)\.(\d+)', out)
          if not m or (int(m.group(1)), int(m.group(2))) < (2, 40):
              sys.exit(f'::error::git too old: {out.strip()!r}; RepoLens requires >= 2.40')
          print(f'git ok: {out.strip()}')
          "

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m unittest discover

      # requirements*.txt are generated from uv.lock, not authored. If someone
      # changes a dependency and forgets to re-export, the two manifests drift
      # -- which is what left 38 advisories open against the old poetry.lock.
      - name: Verify generated requirements are current
        run: |
          set -euo pipefail

          # Compare pinned content only. Two kinds of comment are noise here:
          # uv writes the exact `-o` argument it was given into the header, so
          # exporting to a temp path differs trivially; and the indented
          # `# via <package>` annotations are provenance, not pins. Strip both.
          content() { grep -vE '^[[:space:]]*#' "$1"; }

          uv export --format requirements-txt --no-dev --no-emit-project -o /tmp/requirements.txt
          uv export --format requirements-txt --no-emit-project -o /tmp/requirements-dev.txt

          if ! diff -u <(content requirements.txt) <(content /tmp/requirements.txt); then
            echo "::error file=requirements.txt::Stale. Regenerate with the uv export command in DEVELOPER.md"
            exit 1
          fi
          if ! diff -u <(content requirements-dev.txt) <(content /tmp/requirements-dev.txt); then
            echo "::error file=requirements-dev.txt::Stale. Regenerate with the uv export command in DEVELOPER.md"
            exit 1
          fi
