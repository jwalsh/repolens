[project]
name = "repolens"
version = "0.1.0"
description = "Package, present, and analyze project repositories."
authors = [{ name = "Jason Walsh", email = "jasonwalsh@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-caching>=2.3.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "pathspec>=1.1.1",
    "requests>=2.34.2",
    "psycopg2-binary>=2.9.9",
    # Needed only by POST /api/screenshot, imported lazily so the rest of the
    # application runs without them.
    "selenium>=4.24.0",
    "webdriver-manager>=4.0.2",

    # Security floors on transitive dependencies. Not imported directly; listed
    # so the resolver cannot backtrack onto a version with a known advisory
    # while satisfying some future constraint. Each corresponds to a Dependabot
    # alert open on 2026-08-16, when poetry.lock was a year stale and carried
    # 38 of them. Delete an entry once the direct dependency that pulls it in
    # requires at least this version on its own.
    "h11>=0.16.0",             # critical: request smuggling, via selenium
    "jinja2>=3.1.6",           # via flask
    "werkzeug>=3.1.8",         # via flask
    "urllib3>=2.7.0",          # via requests, selenium
    "idna>=3.18",              # via requests
    "python-dotenv>=1.2.3",    # via webdriver-manager
]

[dependency-groups]
dev = [
    # Property-based testing. The clone store's path containment and the job
    # runner's resume guarantee are claims about whole input spaces -- every
    # repository URL, every interruption schedule -- and example tests answer a
    # different question. See tests/test_clones.py and tests/test_jobs.py.
    "hypothesis>=6.165.9",
]

[tool.uv]
required-version = ">=0.12.5"
# RepoLens is an application, not a library: main.py is the entrypoint and
# nothing imports repolens from outside this tree. Application mode means uv
# manages the environment without building or installing the project itself,
# so no build backend is required.
package = false
